# id-aliases.yaml ;;; WSF subject-namespace to canonical-sequential ID reconciliation
# Per LOCKED-PICKS v9 §313-318 ;;; machine-readable mapping
# Author: Emmanuel A. Otchere (cardinal user-authoritative model, 2026-09-28)
# Resolution rule: canonical sequential IDs (ADR-WSF-NNN) are authoritative.

canonical_format: ADR-WSF-NNN
alias_format: WSF-ADR-<SUBJECT>-<LOCAL>
reconciliation_date: 2026-09-28
reconciliation_authority: Emmanuel A. Otchere (cardinal user-authoritative model)

adrs:
  WSF-ADR-CULTURE-001:
